# Continuous integration.
#
#  check       Linux: formatting, lint, types, unit + integration tests against a
#              real PostgreSQL, dependency audit (shipped dependencies only),
#              the packaged app, the packed-tarball check and the browser tests.
#  install-qa  macOS, Linux and Windows on two Node versions: build the package,
#              install the packed tarball into an empty project and run it.
#              (No database: this proves the one-command install, not the data.)
#
# NOTE: this file has not been run on GitHub yet (nothing is pushed). Expect to
# fix small problems, especially on Windows, on its first run.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATACANVAS_TEST_PG_URL: postgresql://postgres:testpass@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run package
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  install-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.9.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run verify:package
