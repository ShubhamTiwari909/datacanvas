# Continuous integration.
#
#  check       Linux: formatting, lint, types, unit + integration tests against a
#              real PostgreSQL, dependency audit (shipped dependencies only),
#              the packaged app, the packed-tarball check and the browser tests.
#  postgres-versions  The database tests on PostgreSQL 12 to 18.
#  install-qa  macOS, Linux and Windows on two Node versions: build the package
#              (always on Node 22), then install the packed tarball into an empty
#              project and run it on the Node version under test (20.9.0 and 22).
#              (No database: this proves the one-command install, not the data.)
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATACANVAS_TEST_PG_URL: postgresql://postgres:testpass@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm run package
      - run: pnpm run verify:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  postgres-versions:
    # The PostgreSQL-facing tests (adapter, odd schema, performance, services)
    # against every supported server version, one job each.
    strategy:
      fail-fast: false
      matrix:
        postgres: [12, 13, 14, 15, 16, 17, 18]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: testpass
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATACANVAS_TEST_PG_URL: postgresql://postgres:testpass@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run packages/postgres-adapter apps/web/lib/server/connection-service.integration apps/web/features/paths

  install-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.9.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # BUILD on Node 22. The build tool (Tailwind's @tailwindcss/node) loads magic-string, which
      # is an ES module only, with require(); that works from Node 20.19 and 22.12 and fails on
      # 20.9 to 20.18. Users never build: they install the prebuilt package.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      # RUN the packed package on the Node version under test. This is what the job proves:
      # the one-command install works on the oldest Node we support (20.9.0) and on a current one.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm run verify:package
