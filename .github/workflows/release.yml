# Publishing to npm. Runs ONLY when the maintainer pushes a version tag such as v1.0.0.
#
# It uses npm "trusted publishing" (OIDC): no long-lived npm token is stored in
# GitHub. The maintainer must first configure the package on npmjs.com to trust
# this repository and workflow (see docs/releasing.md). Nothing here can
# publish until that is done, and a tag push is a deliberate human action.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow's identity and record provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATACANVAS_TEST_PG_URL: postgresql://postgres:testpass@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. Node 22 ships npm 10, which never asks for the OIDC token
      # and publishes without credentials: the registry then answers 404 (seen on the v1.11.0 tag).
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm run package
      - run: pnpm run verify:package
      - run: pnpm run release:check
      - name: The tag must match the package version
        run: |
          test "v$(node -p "require('./.package/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish (pre-releases go to the "next" tag, stable versions to "latest")
        run: |
          VERSION="$(node -p "require('./.package/package.json').version")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          npm publish ./.package --provenance --access public --tag "$TAG"
